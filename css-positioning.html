<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .parent{
            position: relative;
            width: 300px;
            height: 200px;
            background-color: aqua;
        }
        .child{
            position:absolute;

            top: 20px;
            right: 20px;

            width: 80px;
            height: 80px;

            background-color: red;
            /* padding: 20px;
            text-align: center; */
            color: white;
        }
        .fix{
            position: fixed;
            background-color: yellow;
            bottom: 20px;
            right: 20px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="parent">
        Parent
        <div class="child">Child</div>
    </div>

    <div class="fix">Help</div>
</body>
</html>
