<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .box1{
            width: 200px;
            height: 100px;
            background-color: orangered;
            margin-top: 10px;
        }
        .box2{
            width: 50%;
            height: 100px;
            background-color: aqua;
            margin-bottom: 10px;
        }
        h1{
            font-size: 3rem;
        }
        .hero{
            height: 100vh;
            background-color: yellow;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>CSS Units Examples</h1>
    <div class="box1" >200px Width</div>
    <div class="box2" >50% Width</div>
    <div class="hero" >100vh Height</div>
</body>
</html>
